# Compression and auth rate limiting added 2026-09-03.
#
# The bundle was served UNCOMPRESSED: a 2.68 MB main chunk, 803 KB for the UI kit,
# 333 KB of CSS and a 474 KB PNG on the login screen, so ~4.4 MB over the wire before
# a warehouse tablet on 4G shows anything. Text and JavaScript compress by roughly
# 70-80%, which takes that to about 1.1 MB for one directive.
#
# `limit_req` is the zero-code half of the login throttle. The application throttles
# too (app/core/throttle.py), because the API is also reachable directly on the LAN
# and a limit that lives only in the edge config is one nobody reviewing the handler
# can see. Each of the endpoints below runs a ~300 ms bcrypt: unmetered, they are a
# denial-of-service button that needs no valid credential.

# 10 MB holds ~160,000 addresses. `burst=20 nodelay` lets a real person's retries and
# a shared office NAT through while still cutting off a script.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
limit_req_status 429;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # The four unauthenticated doors, each in front of a bcrypt or an outbound mail.
    # Declared before the general /api/ block so they win the longest-prefix match.
    location = /api/auth/login {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /api/auth/forgot-password {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/supplier/login {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/carrier/login {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # NOT proxied, deliberately: /metrics is unauthenticated and names every route in
    # the system. Scraped from inside the compose network, on the backend directly.
    location = /metrics {
        return 404;
    }

    location = /health/ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
